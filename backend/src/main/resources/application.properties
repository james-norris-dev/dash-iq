spring.application.name=dashIQ

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/dashiq_db
spring.datasource.username=dashiq_user
spring.datasource.password=dashiq_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true





