services:
  mysql:
    image: mysql:8.4
    container_name: dashiq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dashiq_db
      MYSQL_USER: dashiq_user
      MYSQL_PASSWORD: dashiq_password
    ports:
      - "3307:3306"
    volumes:
      - dashiq_mysql_data:/var/lib/mysql

volumes:
  dashiq_mysql_data: